:root{

html,body{height:100%}
body{background:var(--dusk);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}

.inner{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:6px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-family:var(--display);font-size:1.35rem;font-weight:700;display:flex;align-items:baseline;gap:4px;min-width:0}
.name button{font:inherit;color:var(--eye);background:none;border:0;border-bottom:1px dashed rgba(195,216,111,.45);padding:0;cursor:pointer}
.name input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 6px;width:6em}
.hbtns{display:flex;gap:6px}
.chip{font:500 .8rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}

.lines{display:grid;gap:2px}
.status{font-family:var(--display);font-size:1.02rem;color:var(--ink);margin:0;min-height:1.35em;line-height:1.35}
.want{font-size:.82rem;color:var(--muted);margin:0;min-height:1.3em;line-height:1.3}
.want.on{color:var(--amber);font-weight:500}
.needs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.need{display:grid;gap:3px;font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.need i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.need b{display:block;height:100%;border-radius:3px;background:var(--eye);transition:width .4s,background .4s}
.need.low{color:var(--amber)}.need.low b{background:var(--amber)}
.need.bad{color:var(--rose)}.need.bad b{background:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:76px;gap:5px}
.grid button{font:500 .8rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 2px;cursor:pointer;
  display:grid;grid-template-rows:26px 1fr;justify-items:center;align-items:center;gap:3px;box-sizing:border-box;min-width:0;width:100%;height:100%;transition:transform .1s}
.grid .tool-label{display:block;line-height:1.25;white-space:nowrap;text-align:center}
.grid svg{flex-shrink:0}
.grid button:active{transform:scale(.95)}
.grid button:focus-visible,.chip:focus-visible{outline:2px solid var(--eye);outline-offset:2px}
.grid button[aria-pressed="true"]{background:#4b402a;border-color:var(--amber);color:#fff2d6;box-shadow:inset 0 0 0 1px var(--amber),0 0 8px rgba(234,182,92,.18)}

.grid svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
