<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑屁屁｜所有窗外天氣動畫</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7da;color:#443b30;font:16px/1.6 system-ui}main{max-width:960px;margin:auto;padding:24px 16px}h1{font-size:24px}p{color:#7a6b59}section{padding:16px;background:#fffaf1;border:1px solid #d8c9b2;border-radius:14px;margin:16px 0}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}label{display:grid;gap:4px;font-size:14px}select,button,input{font:inherit}select,button{padding:9px;border:1px solid #c5b28f;border-radius:8px;background:#fffdf8;color:#4d4233;cursor:pointer}canvas{width:100%;display:block;background:#e3c7a2}button:disabled{opacity:.4}.viewer{padding:0;overflow:hidden}.caption{padding:12px 16px;font-weight:600}a{color:#745937}.notes{font-size:13px}</style><main><h1>窗外天氣動畫展示</h1><p>使用遊戲目前的窗景動畫，切換情境即可觀看，不必等待現實天氣發生。</p><a href="./">← 回黑屁屁的房間</a><section class="controls"><label>模式<select id="layout"><option value="desktop">網頁版房間</option><option value="phone">手機版窗戶</option></select></label><label>天氣<select id="weather"></select></label><label>季節<select id="season"><option value="03-21">春季</option><option value="06-21">夏季</option><option value="10-26" selected>秋季</option><option value="12-21">冬季</option></select></label><label>時段 <output id="time">12:00</output><input type="range" id="hour" min="0" max="23.75" step=".25" value="12"></label><button id="day">白天</button><button id="night">夜晚</button><button id="pause">暫停動畫</button><button id="flash" disabled>立即播放閃電</button></section><section class="viewer"><div class="caption" id="caption"></div><canvas id="preview" width="1200" height="700" aria-label="可切換所有天氣的窗外動畫"></canvas></section><section><strong>目前支援全部 28 種天氣選項</strong><p id="allWeather"></p><p class="notes">此頁是模擬展示，不會更動房間實際天氣。部分天氣使用相同動畫類型，差別主要在雨勢、雲量與速度。雪、凍雨和冰雹也能預覽，但遊戲只依實際天氣資料顯示。選擇雷雨後可立即播放閃電；開啟系統「減少動態」時不播放閃光。</p></section></main><script src="assets/suncalc.js"></script><script src="window-scene.js"></script><script src="outdoors.js"></script><script>
const list=[[0,'晴天',0,0],[1,'晴時多雲',20,0],[2,'多雲',55,0],[3,'陰天',100,0],[45,'霧',90,0],[48,'霧淞',100,0],[51,'微毛毛雨',78,.1],[53,'毛毛雨',88,.5],[55,'濃密毛毛雨',98,1],[56,'微凍毛毛雨',90,.2],[57,'強凍毛毛雨',100,1.5],[61,'小雨',78,1],[63,'中雨',90,4],[65,'大雨',100,10],[66,'微凍雨',90,1],[67,'強凍雨',100,8],[80,'小陣雨',65,1.5],[81,'中陣雨',85,5],[82,'強陣雨',100,15],[71,'小雪',75,.3],[73,'中雪',90,2],[75,'大雪',100,6],[77,'雪粒',90,1],[85,'小陣雪',85,1],[86,'強陣雪',100,5],[95,'雷雨',96,8],[96,'雷雨伴小冰雹',100,9],[99,'雷雨伴強冰雹',100,16]];
const $=id=>document.getElementById(id);for(const row of list){const o=document.createElement('option');o.value=row[0];o.textContent=row[1];$('weather').append(o)}$('allWeather').textContent=list.map(r=>r[1]).join('、');const img=new Image();img.src='assets/home-b-room.png';const panorama=new Image();panorama.src='assets/home-panorama-v4.jpg';const plant=new Image();plant.src='assets/home-plant-v4.webp';const c=$('preview').getContext('2d');let elapsed=0,last=0,paused=false,offset=0;
function base(){const h=+$('hour').value;return new Date('2026-'+$('season').value+'T'+String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0')+':00+08:00')}
function selected(){return list.find(r=>r[0]===+$('weather').value)}function refresh(){$('preview').height=$('layout').value==='desktop'?400:700;const row=selected();$('time').textContent=String(Math.floor(+$('hour').value)).padStart(2,'0')+':'+String(Math.round(+$('hour').value%1*60)).padStart(2,'0');$('caption').textContent=row[1]+' · '+$('season').selectedOptions[0].textContent+' · '+$('time').textContent+'（模擬）';$('flash').disabled=row[0]<95;offset=0}
$('layout').onchange=refresh;$('weather').onchange=refresh;$('season').onchange=refresh;$('hour').oninput=refresh;$('day').onclick=()=>{$('hour').value=12;refresh()};$('night').onclick=()=>{$('hour').value=22;refresh()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續動畫':'暫停動畫'};$('flash').onclick=()=>{paused=false;$('pause').textContent='暫停動畫';const t=(+base()+elapsed)/1000;offset=(23-t%23)%23+.03};
function tick(ms){const dt=Math.min(100,last?ms-last:0);last=ms;if(!paused)elapsed+=dt;const row=selected();RoomOutdoors.weather.updated=Date.now();RoomOutdoors.weather.current={weather_code:row[0],cloud_cover:row[2],precipitation:row[3],wind_speed_10m:row[0]>=95?30:row[3]>4?22:8};const date=new Date(+base()+elapsed+offset*1000);if($('layout').value==='desktop'){c.setTransform(1,0,0,1,0,0);c.fillStyle='#e8cfae';c.fillRect(0,0,1200,400);const scale=1200/2600;c.setTransform(scale,0,0,scale,1000*scale,0);if(panorama.complete&&panorama.naturalWidth){WindowScene.panoramaBackdrop(c,panorama,{plant});WindowScene.draw(c,RoomOutdoors.state(date),date,{panorama:true,floor:215,backdrop:panorama},matchMedia('(prefers-reduced-motion: reduce)').matches)}}else{c.setTransform(2,0,0,2,-1280,0);if(img.complete&&img.naturalWidth){c.drawImage(img,0,0);WindowScene.draw(c,RoomOutdoors.state(date),date,{left:0,width:1586,floor:992*.344,backdrop:img},matchMedia('(prefers-reduced-motion: reduce)').matches)}}requestAnimationFrame(tick)}refresh();requestAnimationFrame(tick);
</script></html>
